name: Keep stage awake

# O plano free do Render hiberna a API após ~15 min sem tráfego (e o Neon suspende o
# compute ocioso), deixando o primeiro login lento. Este ping a cada 5 min evita as duas
# hibernações: /api/health consulta o banco.
#
# A URL padrão é a do stage; para outro ambiente, defina a variável de repositório
# STAGE_API_URL (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        env:
          URL: ${{ vars.STAGE_API_URL || 'https://lastro-egha.onrender.com' }}
        run: |
          # --retry cobre o cold start (o primeiro request pode levar ~1 min).
          curl --fail --silent --show-error \
            --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
            --output /dev/null --write-out "status=%{http_code} total=%{time_total}s\n" \
            "${URL%/}/api/health"
