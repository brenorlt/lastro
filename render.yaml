services:
  - type: web
    name: lastro-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      # URL pública do frontend (ex.: https://lastrofinance.com) — usada em links de
      # e-mail e na validação de origem de /auth/refresh e /auth/logout.
      - key: APP_URL
        sync: false
      # Connection string do Neon (ou outro Postgres externo), de preferência a pooled
      # (host termina em "-pooler"). Formato: postgresql://usuario:senha@host/banco?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Mesmo banco, porém a conexão DIRETA (sem "-pooler" no host) — necessária só para
      # `prisma migrate deploy` no start do container (ver comentário no schema.prisma).
      - key: DIRECT_URL
        sync: false
      # Gerados automaticamente pelo Render ao criar o serviço; nunca reaproveite entre ambientes.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Mesma URL pública do frontend, separada por vírgula se houver mais de uma
      # (ex.: https://lastrofinance.com,https://www.lastrofinance.com).
      - key: CORS_ORIGINS
        sync: false
      # Render está na frente da API com seu próprio proxy — 1 hop confiável.
      - key: TRUST_PROXY
        value: "1"
      # Sem disco persistente no plano free do Render: avatares enviados não sobrevivem
      # a um redeploy/restart até isso migrar para um storage externo (ex.: Cloudflare R2).
      - key: UPLOAD_DIR
        value: ./storage
      - key: MAIL_TRANSPORT
        value: log
      # Login com Google — OAuth Client "Web" no Google Cloud com a redirect URI
      # ${APP_URL}/api/auth/google/callback. Ambos vazios = login com Google desativado.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Opcional: token da brapi.dev para Ibovespa e ações da carteira nos insights do painel
      # (sem ele, só PETR4, VALE3, ITUB4 e MGLU3).
      - key: BRAPI_TOKEN
        sync: false
      - key: ABACATEPAY_API_KEY
        sync: false
      - key: ABACATEPAY_WEBHOOK_SECRET
        sync: false
      # ID do produto AbacatePay (ainda não consumido pelo código — reservado para quando
      # o checkout por produto/plano fixo for implementado; hoje o fluxo é transparent charge).
      - key: ABACATEPAY_PRODUCT_ID
        sync: false
